<svg width="850" height="204" viewBox="0 0 850 204" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Photoroom highlights: Rookie of the Year, 350+ PRs merged, 4 major features shipped">
  <defs>
    <clipPath id="panel"><rect width="850" height="204" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes shimmer { 0%, 100% { opacity: 1 } 50% { opacity: 0.55 } }
    .shimmer { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <g clip-path="url(#panel)">
    <rect width="850" height="204" fill="#0B0E14"/>
  </g>

  <text x="48" y="52" class="mono" font-size="14" fill="#5F6B84"><tspan fill="#5B8CFF">~</tspan> <tspan fill="#8A93A5">$</tspan> photoroom <tspan fill="#667089">--highlights</tspan></text>

  <!-- card 1: award -->
  <g>
    <rect x="48" y="72" width="234" height="106" rx="14" fill="#10141D" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="48" y="94" width="3" height="62" rx="1.5" fill="#F0B429"/>
    <text x="70" y="102" class="mono shimmer" font-size="11" letter-spacing="1.5" fill="#F0B429">AWARD</text>
    <text x="70" y="130" font-size="17" font-weight="700" fill="#F2F5FA">Rookie of the Year</text>
    <text x="70" y="154" font-size="12.5" fill="#8A93A5">in my first 4.5 months</text>
  </g>

  <!-- card 2: velocity -->
  <g>
    <rect x="298" y="72" width="234" height="106" rx="14" fill="#10141D" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="298" y="94" width="3" height="62" rx="1.5" fill="#5B8CFF"/>
    <text x="320" y="102" class="mono" font-size="11" letter-spacing="1.5" fill="#5B8CFF">VELOCITY</text>
    <text x="320" y="132" font-size="24" font-weight="800" fill="#F2F5FA">350+ <tspan font-size="15" font-weight="600" fill="#C3CBDA">PRs merged</tspan></text>
    <text x="320" y="154" font-size="12.5" fill="#8A93A5">and counting</text>
  </g>

  <!-- card 3: shipped -->
  <g>
    <rect x="548" y="72" width="234" height="106" rx="14" fill="#10141D" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="548" y="94" width="3" height="62" rx="1.5" fill="#E5484D"/>
    <text x="570" y="102" class="mono" font-size="11" letter-spacing="1.5" fill="#E5484D">SHIPPED</text>
    <text x="570" y="128" font-size="17" font-weight="700" fill="#F2F5FA">4 major features</text>
    <text x="570" y="149" font-size="11.5" fill="#8A93A5">Virtual Models · AI Video Gen</text>
    <text x="570" y="165" font-size="11.5" fill="#8A93A5">Share Links · Design System</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="203" rx="17.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
