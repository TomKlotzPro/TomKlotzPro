<svg width="850" height="266" viewBox="0 0 850 266" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career timeline: Algolia (search engine, software engineering), CastorDoc (data catalog, fullstack engineering), Ministère des Armées (defense, software engineering), Photoroom (AI, software engineering)">
  <defs>
    <clipPath id="panel"><rect width="850" height="266" rx="18"/></clipPath>
    <clipPath id="flagNode"><circle cx="510" cy="148" r="12.5"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes flow { to { stroke-dashoffset: -64 } }
    .flow { animation: flow 3.2s linear infinite; }
    @keyframes pulse { 0%, 100% { stroke-opacity: 0.9 } 50% { stroke-opacity: 0.3 } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
  </style>

  <g clip-path="url(#panel)">
    <rect width="850" height="266" fill="#0B0E14"/>
  </g>

  <text x="48" y="52" class="mono" font-size="14" fill="#5F6B84"><tspan fill="#5B8CFF">~</tspan> <tspan fill="#8A93A5">$</tspan> git log <tspan fill="#667089">--reverse</tspan> career/</text>

  <!-- timeline base -->
  <line x1="90" y1="148" x2="742" y2="148" stroke="#232C42" stroke-width="2"/>
  <line class="flow" x1="90" y1="148" x2="742" y2="148" stroke="#5B8CFF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 54"/>
  <path d="M742 148 l-9 -5 v10 z" fill="#33405E"/>

  <!-- Algolia -->
  <g>
    <text x="130" y="104" text-anchor="middle" class="mono" font-size="11" fill="#5F6B84">a190l1a</text>
    <circle cx="130" cy="148" r="20" fill="#0B0E14" stroke="#3E63DD" stroke-width="2"/>
    <circle cx="130" cy="148" r="12.5" fill="#003DFF"/>
    <text x="130" y="152.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#FFFFFF">A</text>
    <text x="130" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECF4">Algolia</text>
    <text x="130" y="210" text-anchor="middle" font-size="12" fill="#8A93A5">Search engine</text>
    <text x="130" y="228" text-anchor="middle" font-size="11" fill="#5F6B84">software engineering</text>
  </g>

  <!-- CastorDoc -->
  <g>
    <text x="320" y="104" text-anchor="middle" class="mono" font-size="11" fill="#5F6B84">ca570rd</text>
    <circle cx="320" cy="148" r="20" fill="#0B0E14" stroke="#FF9466" stroke-width="2"/>
    <circle cx="320" cy="148" r="12.5" fill="#FF7847"/>
    <text x="320" y="152.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3A1503">C</text>
    <text x="320" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECF4">CastorDoc</text>
    <text x="320" y="210" text-anchor="middle" font-size="12" fill="#8A93A5">Data catalog</text>
    <text x="320" y="228" text-anchor="middle" font-size="11" fill="#5F6B84">fullstack engineering</text>
  </g>

  <!-- Ministère des Armées -->
  <g>
    <text x="510" y="104" text-anchor="middle" class="mono" font-size="11" fill="#5F6B84">a5m335f</text>
    <circle cx="510" cy="148" r="20" fill="#0B0E14" stroke="#F5F7FA" stroke-opacity="0.75" stroke-width="2"/>
    <g clip-path="url(#flagNode)">
      <rect x="497.5" y="135.5" width="8.34" height="25" fill="#2A63F6"/>
      <rect x="505.84" y="135.5" width="8.33" height="25" fill="#F5F7FA"/>
      <rect x="514.17" y="135.5" width="8.33" height="25" fill="#E5484D"/>
    </g>
    <text x="510" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECF4">Ministère des Armées</text>
    <text x="510" y="210" text-anchor="middle" font-size="12" fill="#8A93A5">Defense · 3 years of service</text>
    <text x="510" y="228" text-anchor="middle" font-size="11" fill="#5F6B84">software engineering</text>
  </g>

  <!-- Photoroom -->
  <g>
    <rect class="pulse" x="646" y="82" width="108" height="22" rx="11" fill="#10151F" stroke="#5B8CFF"/>
    <text x="700" y="97" text-anchor="middle" class="mono" font-size="10.5" fill="#9DB9FF">HEAD → main</text>
    <circle cx="700" cy="148" r="20" fill="#0B0E14" stroke="#A98BFF" stroke-width="2"/>
    <circle cx="700" cy="148" r="12.5" fill="#6E29F7"/>
    <text x="700" y="152.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#FFFFFF">P</text>
    <text x="700" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECF4">Photoroom</text>
    <text x="700" y="210" text-anchor="middle" font-size="12" fill="#8A93A5">AI photo editing</text>
    <text x="700" y="228" text-anchor="middle" font-size="11" fill="#5F6B84">software engineering · now</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="265" rx="17.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
