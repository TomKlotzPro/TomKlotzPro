<svg width="850" height="270" viewBox="0 0 850 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tom Klotz, Software Engineer at Photoroom, Paris, France">
  <defs>
    <clipPath id="panel"><rect width="850" height="270" rx="18"/></clipPath>
    <linearGradient id="tricolore" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A63F6"/>
      <stop offset="0.5" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E5484D"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#A9C2FF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A63F6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2A63F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E5484D" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes blink { 0%, 45% { opacity: 1 } 50%, 95% { opacity: 0 } 100% { opacity: 1 } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .ringA { transform-origin: 672px 135px; animation: spin 26s linear infinite; }
    .ringB { transform-origin: 672px 135px; animation: spin 17s linear infinite reverse; }
    .ringC { transform-origin: 672px 135px; animation: spin 40s linear infinite; }
    @keyframes cycle { 0%, 27% { opacity: 1 } 33%, 94% { opacity: 0 } 100% { opacity: 1 } }
    .f1 { opacity: 1; animation: cycle 13.5s infinite; }
    .f2 { opacity: 0; animation: cycle 13.5s infinite; animation-delay: 4.5s; }
    .f3 { opacity: 0; animation: cycle 13.5s infinite; animation-delay: 9s; }
    @keyframes breathe { 0%, 100% { opacity: 0.85 } 50% { opacity: 0.4 } }
    .core { animation: breathe 3.2s ease-in-out infinite; }
  </style>

  <g clip-path="url(#panel)">
    <rect width="850" height="270" fill="#0B0E14"/>
    <circle cx="672" cy="135" r="170" fill="url(#glowB)"/>
    <circle cx="120" cy="250" r="160" fill="url(#glowR)"/>
    <rect width="850" height="3" fill="url(#tricolore)"/>

    <!-- arc-ring monogram -->
    <circle cx="672" cy="135" r="96" stroke="#242E44" stroke-width="1" stroke-dasharray="2 6"/>
    <g class="ringC">
      <circle cx="672" cy="135" r="82" stroke="#33405E" stroke-width="1.5" stroke-dasharray="40 14 8 14"/>
    </g>
    <g class="ringA">
      <circle cx="672" cy="135" r="64" stroke="#5B8CFF" stroke-width="2.5" stroke-dasharray="110 292" stroke-linecap="round"/>
      <circle cx="672" cy="135" r="64" stroke="#5B8CFF" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="30 372" stroke-dashoffset="-160" stroke-linecap="round"/>
    </g>
    <g class="ringB">
      <circle cx="672" cy="135" r="46" stroke="#E5484D" stroke-width="2" stroke-dasharray="70 219" stroke-linecap="round"/>
    </g>
    <circle cx="672" cy="135" r="30" fill="#10151F" stroke="#2C3854" stroke-width="1.5"/>
    <circle class="core" cx="672" cy="135" r="30" fill="#5B8CFF" fill-opacity="0.08"/>
    <text x="672" y="142" text-anchor="middle" class="mono" font-size="19" font-weight="700" fill="#DCE6FF">TK</text>
  </g>

  <!-- prompt -->
  <text x="48" y="62" class="mono" font-size="14" fill="#5F6B84"><tspan fill="#5B8CFF">~</tspan> <tspan fill="#8A93A5">$</tspan> whoami</text>
  <rect class="cursor" x="140" y="50" width="8" height="15" fill="#5B8CFF"/>

  <!-- name + role -->
  <text x="46" y="118" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#nameGrad)">Tom Klotz</text>
  <text x="48" y="152" font-size="17" fill="#C3CBDA">Software Engineer <tspan fill="#5F6B84">@</tspan> <tspan fill="#A98BFF" font-weight="600">Photoroom</tspan></text>

  <!-- location -->
  <g>
    <rect x="48" y="172" width="8" height="16" rx="2" fill="#2A63F6"/>
    <rect x="56" y="172" width="8" height="16" fill="#F5F7FA"/>
    <rect x="64" y="172" width="8" height="16" rx="2" fill="#E5484D"/>
    <text x="82" y="185" font-size="14" fill="#8A93A5">Paris, France</text>
  </g>

  <!-- cycling facts -->
  <g class="mono" font-size="14">
    <text class="f1" x="48" y="232" fill="#9AA6BC"><tspan fill="#5B8CFF">→</tspan> raised on API clients @ Algolia, beside open-source experts</text>
    <text class="f2" x="48" y="232" fill="#9AA6BC"><tspan fill="#E5484D">→</tspan> served France for 3 years · Ministère des Armées</text>
    <text class="f3" x="48" y="232" fill="#9AA6BC"><tspan fill="#A98BFF">→</tspan> now shipping AI photo tools to millions</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="269" rx="17.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
